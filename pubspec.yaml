name: buildervet
description: A renovation platform for managing tasks, projects, and contractors.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0

  # Navigation
  go_router: ^14.0.0

  # Utilities
  intl: ^0.19.0

  # Material Design
  cupertino_icons: ^1.0.6
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  shared_preferences: ^2.5.5
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  firebase_storage: ^13.2.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^21.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/mock_users.json
